add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# frame-src: o widget do Pluggy (pluggy-connect-sdk) abre um modal com iframe em
# connect.pluggy.ai — sem isso, o navegador bloquearia o iframe.
# connect-src: só 'self', porque o próprio documento (esta página) só chama a própria API
# (baseUrl relativo, ver src/api/client.ts) — nunca api.pluggy.ai direto do browser (isso é o
# backend, do lado do servidor). O document dentro do iframe tem sua própria CSP, definida pelo
# servidor da Pluggy, não pela nossa connect-src; por isso api.pluggy.ai não entra aqui.
#
# Nota para quando um default-src mais restritivo entrar (hoje não há um, então tudo que não
# está listado continua liberado): vai precisar de img-src https://cdn.pluggy.ai (logo dos
# bancos, ver institution_logo_url) e de style-src 'unsafe-inline' (o próprio widget injeta
# estilo inline no documento pai antes do iframe carregar).
add_header Content-Security-Policy "frame-ancestors 'none'; frame-src https://connect.pluggy.ai; connect-src 'self'" always;
