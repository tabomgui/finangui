add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# frame-src: o widget do Pluggy (react-pluggy-connect) abre um iframe em connect.pluggy.ai.
# connect-src: 'self' porque o próprio frontend só chama a própria API (baseUrl relativo,
# ver src/api/client.ts); api.pluggy.ai é quem o widget hospedado chama diretamente do
# navegador (o backend fala com a Pluggy pelo lado do servidor, sem precisar disso, mas o
# iframe em si faz chamadas do browser).
add_header Content-Security-Policy "frame-ancestors 'none'; frame-src https://connect.pluggy.ai; connect-src 'self' https://api.pluggy.ai" always;
