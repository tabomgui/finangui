# Preserva o esquema original (https vindo do proxy TLS); cai para $scheme no acesso direto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    include /etc/nginx/snippets/nginx-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Resolver do Docker embedded DNS + proxy_pass por variável: evita que o
    # nginx fixe o IP do `backend` na primeira resolução (cache de DNS do
    # worker) e passe a apontar para um container morto depois de um
    # redeploy/recreate do backend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|sanctum|up)(/|$) {
        set $backend_upstream http://backend:8000;

        # Location com regex: sem segmento de URI depois do host no
        # proxy_pass, o nginx já envia a URI original (/api/v1/...) sem
        # reescrever — com ou sem variável. Confirmado batendo em
        # /api/v1/auth/status: chega em Laravel como /api/v1/auth/status.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /assets/ {
        include /etc/nginx/snippets/nginx-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/nginx-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
