<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Finangui: você cunhado numa moeda -->
  <defs>
    <clipPath id="field"><circle cx="32" cy="32" r="24"/></clipPath>
    <radialGradient id="gold" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.6" stop-color="#F0B93A"/>
      <stop offset="1" stop-color="#C98A1C"/>
    </radialGradient>
    <radialGradient id="fieldGold" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#F7CE5B"/>
      <stop offset="1" stop-color="#D99A25"/>
    </radialGradient>
  </defs>

  <!-- corpo da moeda + serrilhado da borda -->
  <circle cx="32" cy="32" r="31" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="29.6" fill="none" stroke="#A86E12" stroke-width="2.6" stroke-dasharray="1.2 1.4" opacity="0.55"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#6E4A0E" stroke-width="1.4"/>

  <!-- aro interno -->
  <circle cx="32" cy="32" r="25.2" fill="url(#fieldGold)" stroke="#7A5512" stroke-width="1.6"/>

  <!-- retrato cunhado (tons de ouro) -->
  <g clip-path="url(#field)" stroke="#5E400C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ombros / moletom -->
    <path d="M10 60 C10 49 19 45 25 45 L39 45 C45 45 54 49 54 60 Z" fill="#B47A18"/>
    <path d="M25 45 C27 50 37 50 39 45 L39 42 L25 42 Z" fill="#9C6912"/>
    <!-- pescoço -->
    <path d="M27.5 40 L27.5 46 C27.5 48.5 36.5 48.5 36.5 46 L36.5 40 Z" fill="#D9A23A"/>
    <!-- orelhas -->
    <ellipse cx="19.8" cy="31" rx="2.6" ry="3.4" fill="#E9B54A"/>
    <ellipse cx="44.2" cy="31" rx="2.6" ry="3.4" fill="#E9B54A"/>
    <!-- rosto -->
    <path d="M20.5 28 C20.5 18 25.5 13.5 32 13.5 C38.5 13.5 43.5 18 43.5 28 C43.5 36 38.8 41.5 32 41.5 C25.2 41.5 20.5 36 20.5 28 Z" fill="#F2C55C"/>
    <!-- cabelo -->
    <path d="M19 30
             C16.5 22 17 16 22 12.8
             C21.5 10.5 23 9.8 24.5 10.5
             C24.6 9 27 9 27.6 10.4
             C28.6 8.2 31.3 8.8 32 10.3
             C33.6 8.8 36.6 9.6 37.2 11.8
             C42.8 13.4 45.6 19 44.2 27.6
             C43.4 25.4 42.6 23.8 40.4 23.2
             C38.6 25.4 35.6 26.2 32 26.2
             C28.2 26.2 25.2 25.4 23.6 23.2
             C21.4 24.6 19.8 27 19 30 Z" fill="#FFE29A"/>
    <path d="M24.5 11 C26 13.4 27.6 14.2 30 14.2" fill="none" stroke="#C99528" stroke-width="0.9"/>
    <path d="M33 11 C34.6 13.4 37 14.8 40 15.6" fill="none" stroke="#C99528" stroke-width="0.9"/>
    <!-- óculos -->
    <rect x="21.6" y="26.4" width="9.4" height="8" rx="2.8" fill="#FFF1C2" fill-opacity="0.35" stroke="#3E2A06" stroke-width="1.8"/>
    <rect x="33" y="26.4" width="9.4" height="8" rx="2.8" fill="#FFF1C2" fill-opacity="0.35" stroke="#3E2A06" stroke-width="1.8"/>
    <path d="M31 29.6 L33 29.6" stroke="#3E2A06" stroke-width="1.8"/>
    <!-- olhos -->
    <circle cx="26.3" cy="30.6" r="1.5" fill="#3E2A06" stroke="none"/>
    <circle cx="37.7" cy="30.6" r="1.5" fill="#3E2A06" stroke="none"/>
    <!-- nariz -->
    <path d="M31.4 33 C30.6 35.2 31.3 36 32.8 36" fill="none" stroke-width="1.1"/>
    <!-- sorriso -->
    <path d="M27 37.8 C29.2 41.6 34.8 41.6 37 37.8 C34.2 39.2 29.8 39.2 27 37.8 Z" fill="#8A5A0E"/>
  </g>

  <!-- estrelinhas de cunhagem -->
  <g fill="#7A5512">
    <path d="M10.5 32 l1.1 -2.2 l1.1 2.2 l-1.1 2.2 Z"/>
    <path d="M51.3 32 l1.1 -2.2 l1.1 2.2 l-1.1 2.2 Z"/>
  </g>

  <!-- brilho -->
  <path d="M12 22 C14.5 15 20 10 27 8.4" fill="none" stroke="#FFF6D6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
